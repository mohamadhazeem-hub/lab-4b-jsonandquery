<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        .book {
            background-color: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        #error {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Book Information</h1>

    <h2>First Book Title</h2>
    <p id="firstTitle">Loading...</p>

    <h2>Second Book Author</h2>
    <p id="secondAuthor">Loading...</p>

    <h2>Genres of Both Books</h2>
    <div id="genres"></div>

    <p id="error"></p>

    <script>
        async function loadBooks() {
            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Unable to load the book data.");
                }

                const data = await response.json();

                if (!Array.isArray(data.books) || data.books.length < 2) {
                    throw new Error("The JSON data must contain at least two books.");
                }

                const firstBook = data.books[0];
                const secondBook = data.books[1];

                // Display the title of the first book
                document.getElementById("firstTitle").textContent =
                    firstBook.title;

                // Display the author of the second book
                document.getElementById("secondAuthor").textContent =
                    secondBook.author;

                // Display the genres of both books
                const genresDiv = document.getElementById("genres");

                [firstBook, secondBook].forEach(function(book) {
                    const bookDiv = document.createElement("div");
                    bookDiv.className = "book";

                    const heading = document.createElement("h3");
                    heading.textContent = book.title;

                    const paragraph = document.createElement("p");
                    paragraph.textContent =
                        book.genres.join(", ");

                    bookDiv.appendChild(heading);
                    bookDiv.appendChild(paragraph);

                    genresDiv.appendChild(bookDiv);
                });

            } catch (error) {
                document.getElementById("error").textContent =
                    "Error: Unable to load or read the book data. " +
                    error.message;
            }
        }

        loadBooks();
    </script>

</body>
</html>
