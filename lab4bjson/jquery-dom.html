<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript and jQuery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .myStyle {
            background-color: coral;
            padding: 16px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>

    <!-- Include jQuery 4.0.0 full build -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

</head>

<body>

    <h1>JavaScript and jQuery DOM Operations</h1>

    <div id="myElement">Original Text</div>

    <br>

    <div id="myDIV">
        <p>I am a myDIV.</p>
    </div>

    <br>

    <button id="myButton">Click me</button>

    <script>
        $(document).ready(function() {

            // (a) Change the text of myElement
            $("#myElement").text("Modified Text");

            // (b) Add the myStyle class to myDIV
            $("#myDIV").addClass("myStyle");

            // (c) Display an alert when the button is clicked
            $("#myButton").on("click", function() {
                alert("Button clicked!");
            });

        });
    </script>

</body>
</html>
